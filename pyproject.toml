[project]
name = "payments_service"
version = "0.1.0"
description = "Async payment processing service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.17.1",
    "dishka==1.9.1",
    "fastapi==0.121.0",
    "aio-pika>=9.0.0",
    "granian==2.5.7",
    "httpx==0.28.1",
    "asyncpg==0.30.0",
    "greenlet==3.2.4",
    "pydantic==2.12.4",
    "pydantic-settings==2.11.0",
    "sqlalchemy==2.0.44",
    "stamina==26.1.0",
    "structlog==25.5.0",
    "watchfiles==1.1.1",
    "uvicorn[standard]==0.38.0",
    "aiosqlite>=0.22.1",
    "psycopg2-binary>=2.9.13",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payments_service"]

[tool.ruff]
# Ruff configuration
target-version = "py312"
line-length = 88
indent-width = 4

# File discovery
extend-exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]


[tool.ruff.lint]
# Enable comprehensive linting rules
select = [
    "E4",      # pycodestyle errors
    "E7",      # pycodestyle errors
    "E9",      # pycodestyle errors
    "F",       # pyflakes
    "W",       # pycodestyle warnings
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "UP",      # pyupgrade
    "ARG",     # flake8-unused-arguments
    "SIM",     # flake8-simplify
    "TCH",     # flake8-type-checking
    "TID",     # flake8-tidy-imports
    "Q",       # flake8-quotes
    "I",       # isort
    "N",       # pep8-naming
    "D",       # pydocstyle
    "S",       # flake8-bandit
    "A",       # flake8-builtins
    "COM",     # flake8-commas
    "C90",     # mccabe
    "ICN",     # flake8-import-conventions
    "G",       # flake8-logging-format
    "INP",     # flake8-no-pep420
    "PIE",     # flake8-pie
    "T20",     # flake8-print
    "PYI",     # flake8-pyi
    "PT",      # flake8-pytest-style
    "RSE",     # flake8-raise
    "RET",     # flake8-return
    "SLF",     # flake8-self
    "SLOT",    # flake8-slots
    "YTT",     # flake8-2020
]

ignore = [
    # Allow non-abstract empty methods in abstract base classes
    "B027",
    # Allow boolean positional values in function calls, like `dict.get(... True)`
    "FBT003",
    # Ignore checks for possible passwords
    "S105", "S106", "S107",
    # Ignore complexity
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
    # Allow magic values
    "PLR2004",
    # Allow print statements (useful for debugging)
    "T201",
    # Allow relative imports
    "TID252",
    # Allow star imports in __init__.py
    "F403", "F401",
    # Allow long lines in comments and strings
    "E501",
    # Allow unused imports in __init__.py
    "F401",
    # Conflict with formatter
    "COM812",
    "D101",
    "D102",
    "D103",
    "D104",
    "D106",
    "D107",
    "D100",
    "N818",
    "D105",
    "INP001",
    "D415",
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
known-first-party = ["payments_service"]
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Extracted FastStream code - minimal changes per README
"src/payments_service/infrastructures/broker/aio_pika/message.py" = [
    "SIM105",    # try-except-pass is intentional
]
"src/payments_service/infrastructures/broker/aio_pika/schemas.py" = [
    "D205",      # Docstring format from FastStream
]

# Tests can use magic values, assertions, and relative imports
"tests/**/*.py" = [
    "S101",      # Use of `assert` detected
    "PLR2004",   # Magic value used in comparison
    "S108",      # Probable insecure usage of temp file/directory
    "TID252",    # Relative imports are banned
    "D100",      # Missing docstring in public module
    "D101",      # Missing docstring in public class
    "D102",      # Missing docstring in public method
    "D103",      # Missing docstring in public function
    "D104",      # Missing docstring in public package
    "D105",      # Missing docstring in magic method
    "D107",      # Missing docstring in __init__
]

# Allow magic values in example files
"examples/**/*.py" = [
    "PLR2004",   # Magic value used in comparison
    "T201",      # `print` found
    "D100",      # Missing docstring in public module
    "D101",      # Missing docstring in public class
    "D102",      # Missing docstring in public method
    "D103",      # Missing docstring in public function
    "D104",      # Missing docstring in public package
    "D105",      # Missing docstring in magic method
    "D107",      # Missing docstring in __init__
]

# Configuration files can have magic values
"pyproject.toml" = ["PLR2004"]
"setup.py" = ["PLR2004"]
"tox.ini" = ["PLR2004"]
"pytest.ini" = ["PLR2004"]




[tool.mypy]
# Mypy configuration
python_version = "3.12"
strict = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
pretty = true
color_output = true
error_summary = true
ignore_missing_imports = true

# Per-module options
[[tool.mypy.overrides]]
module = [
    "tests.*",
    "examples.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

# Ignore missing imports for optional dependencies
[[tool.mypy.overrides]]
module = [
    "granian.*",
    "structlog.*",
    "aio_pika.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Test discovery
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

# Async configuration
asyncio_mode = "auto"

# Environment file for tests (pytest-dotenv)
env_files = [".env.test"]

# Custom markers
markers = [
    "asyncio: mark test as async",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

# Output formatting
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--disable-warnings"
]

# Minimum Python version
minversion = "7.0"

# Filter warnings
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

[project.scripts]
payments_service = "payments_service.main:app"

[dependency-groups]
dev = [
    # Linting and formatting
    "ruff==0.13.1",
    "black==26.3.1",
    "isort==8.0.1",
    # Type checking
    "mypy==1.5.0",
    "types-requests==2.31.0",
    "types-setuptools==82.0.0.20260408",
    # Testing
    "pytest==8.4.2",
    "pytest-asyncio>=0.23.0",
    "pytest-cov==4.1.0",
    "Faker==40.13.0",
    "polyfactory==2.11.0",
    "import-linter>=2.15",
    "vulture>=2.16",
    "aiohttp>=3.11.15",
    "python-dotenv>=1.2.3",
    "pytest-dotenv>=0.5.2",
]

[tool.importlinter]
root_package = "payments_service"

[[tool.importlinter.contracts]]
name = "Domain has no dependencies"
type = "independence"
modules = ["payments_service.domain"]

[[tool.importlinter.contracts]]
name = "Application does not import Infrastructure (except context)"
type = "forbidden"
source_modules = ["payments_service.application"]
forbidden_modules = [
    "payments_service.infrastructures",
    "payments_service.presentation",
    "payments_service.workers",
    "payments_service.config.ioc",
]
ignore_imports = [
    "payments_service.application.use_cases.create_payment -> payments_service.infrastructures.context",
]
unmatched_ignore_imports_alerting = "none"
